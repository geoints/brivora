name: brivora
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.1.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.11.0

  # Authentication
  google_sign_in: ^7.2.0

  # State management / navigation
  provider: ^6.1.5

  # Images
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

  # Notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/icon.png
    - assets/icons/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true