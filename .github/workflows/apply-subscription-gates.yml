name: Apply subscription gates

on:
  push:
    branches: [main]
    paths:
      - tooling/apply_subscription_gates.py
      - lib/features/ai/presentation/screens/ai_tab_screen.dart
      - lib/features/projects/presentation/screens/projects_screen.dart
      - lib/core/services/subscription_service.dart
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply gates
        run: python3 tooling/apply_subscription_gates.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ai/presentation/screens/ai_tab_screen.dart \
                  lib/features/projects/presentation/screens/projects_screen.dart
          git commit -m "feat: enforce Free subscription limits"
          git push
